# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# PR 자동 리뷰 설정. 리뷰는 참고 의견이고 머지 조건은 CI 통과다.
language: ko-KR

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/build/**"
    - "!**/gradlew"
    - "!**/gradlew.bat"
    - "!**/gradle/wrapper/**"
    - "!**/*.lock"
  path_instructions:
    - path: "**/*-service/**"
      instructions: >-
        MSA 규칙을 확인한다. 다른 서비스의 DB·테이블·엔티티를 직접 접근하지 않는지,
        서비스 간 호출은 OpenFeign(동기) 또는 Kafka 이벤트(비동기)만 쓰는지,
        이벤트 DTO를 서비스마다 자기 패키지에 두고 공통 모듈을 만들지 않았는지,
        REST 경로·Kafka 토픽 이름이 규칙(<도메인>-service, <도메인>.<이벤트>.v1)을 따르는지 본다.
    - path: "**/src/main/resources/**"
      instructions: >-
        비밀번호·API 키·토큰 시크릿이 평문으로 들어 있지 않은지 확인한다.
        값은 환경변수(${NAME}) 또는 Config Server 암호화({cipher})여야 한다.
    - path: "**/src/test/**"
      instructions: >-
        테스트가 외부 API(OpenAI·공공데이터)를 실제로 호출하지 않는지, 비밀값을 하드코딩하지 않았는지 본다.

chat:
  auto_reply: true
