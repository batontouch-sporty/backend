name: 이미지 push

# main에 서비스 코드가 들어오면 서비스 8개 이미지를 Docker Hub에 올린다. K8s 워커와 infra EC2가 이 이미지를 받는다.
# 8개 Dockerfile의 build 스테이지가 같아서 먼저 한 번만 빌드해 GHA 캐시에 넣고, 서비스별 job은 그 캐시를 받아 쓴다.
# Docker Hub 설정(secrets DOCKERHUB_USERNAME·DOCKERHUB_TOKEN, variables DOCKERHUB_NAMESPACE)이 없으면 건너뛴다.

on:
  push:
    branches: [main]
    paths:
      - '*-service/**'
      - build.gradle
      - settings.gradle
      - 'gradle/**'
      - gradlew
      - .dockerignore
  workflow_dispatch:

permissions:
  contents: read

# 커밋마다 따로 실행해 대기 중인 실행이 취소되지 않게 한다(커밋별 <sha7> 이미지 보존).
# latest는 맨 아래 latest job에서 따로 한 줄로 세워 갱신한다.
concurrency:
  group: image-push-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    name: Docker Hub 설정 확인
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: 자격 증명 확인
        id: check
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ] && [ -n "$NAMESPACE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Docker Hub 설정이 없어 이미지 빌드·push를 건너뜁니다. secrets DOCKERHUB_USERNAME·DOCKERHUB_TOKEN과 variables DOCKERHUB_NAMESPACE를 등록하세요."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  # 캐시 scope를 커밋별로 나눠 동시에 도는 다른 커밋 실행이 캐시를 덮어쓰지 않게 한다.
  build-stage:
    name: 공통 build 스테이지 캐시
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: build 스테이지 빌드 · 캐시 저장
        uses: docker/build-push-action@v6
        with:
          context: .
          file: user-service/Dockerfile
          target: build
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=sporty-build-${{ github.sha }}
          cache-to: type=gha,scope=sporty-build-${{ github.sha }},mode=max

  push:
    name: ${{ matrix.service }}-service 이미지
    needs: build-stage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [discovery, config, gateway, user, match, facility, ai, notification]
    steps:
      - uses: actions/checkout@v4

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 커밋 태그 계산
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 빌드 context는 저장소 루트다(Dockerfile 주석 참고). 여기서는 <sha7>만 올린다.
      - name: 이미지 빌드 · push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ vars.DOCKERHUB_NAMESPACE }}/sporty-${{ matrix.service }}-service:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=sporty-build-${{ github.sha }}

  # latest는 main에서만, 커밋 실행들을 한 줄로 세워 갱신한다. 새 커밋의 latest job이 들어오면 이전 것은 취소된다.
  # 다시 빌드하지 않고 이미 올린 <sha7> 이미지에 latest 태그만 붙이며, 붙이기 직전에 이 커밋이 main 최신인지 확인한다.
  latest:
    name: latest 태그 갱신
    needs: push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: image-latest-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: main 최신 커밋일 때만 latest 태그
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::7}"
          for svc in discovery config gateway user match facility ai notification; do
            # 서비스마다 붙이기 직전에 다시 확인한다. 조회 실패는 건너뛰지 않고 job을 실패시킨다.
            head="$(git ls-remote "$REPO_URL" refs/heads/main | cut -f1)"
            [ -n "$head" ] || { echo "::error::main HEAD 조회 실패"; exit 1; }
            if [ "$head" != "$GITHUB_SHA" ]; then
              echo "::notice::main이 ${head::7}로 앞서 있어 latest를 갱신하지 않습니다."
              exit 0
            fi
            docker buildx imagetools create -t "$NAMESPACE/sporty-$svc-service:latest" "$NAMESPACE/sporty-$svc-service:$sha"
          done
