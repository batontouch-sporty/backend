server:
  port: 8084

spring:
  application:
    name: ai-service
  config:
    # 로컬 실행 때는 저장소 루트의 .env(docker compose와 같은 파일)에서 OpenAI 키를 읽는다.
    import:
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  ai:
    openai:
      # 키가 비어 있어도 서비스는 뜬다. 이때 AI 호출은 실패하고 초안은 503, 검색·추천은 Fallback으로 응답한다.
      api-key: ${OPENAI_API_KEY:not-configured}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
    retry:
      # LLM이 느리거나 실패할 때 오래 붙잡지 않는다.
      max-attempts: 2
  http:
    client:
      connect-timeout: 3s
      read-timeout: 20s

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
