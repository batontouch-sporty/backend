server:
  port: 8084

spring:
  application:
    name: ai-service
  profiles:
    # IDE 실행은 local. Compose는 dev, K8s는 prod를 SPRING_PROFILES_ACTIVE로 준다.
    default: local
  config:
    # 설정은 config-repo의 ai-service.yml·ai-service-<프로필>.yml에 있다. Config Server에 못 붙으면 기동하지 않는다.
    # IDE 실행 전에 Compose로 config-service를 먼저 띄운다(docker compose up -d --wait config-service).
    # 로컬 실행 때는 저장소 루트의 .env(docker compose와 같은 파일)에서 비밀값·포트를 읽는다.
    import:
      - configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  ai:
    openai:
      # 키가 비어 있어도 서비스는 뜬다. 이때 AI 호출은 실패하고 초안은 503, 검색·추천은 Fallback으로 응답한다.
      # 평문 기본값이 있는 비밀값 자리라 config-repo 검사(환경변수 참조만 허용)를 통과하지 못해 여기 둔다.
      api-key: ${OPENAI_API_KEY:not-configured}
