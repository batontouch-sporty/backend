server:
  port: 8084

spring:
  application:
    name: ai-service
  config:
    # 로컬 실행 때는 저장소 루트의 .env(docker compose와 같은 파일)에서 OpenAI 키를 읽는다.
    import:
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  ai:
    openai:
      # 키가 비어 있어도 서비스는 뜬다. 이때 AI 호출은 실패하고 초안은 503, 검색·추천은 Fallback으로 응답한다.
      api-key: ${OPENAI_API_KEY:not-configured}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
    retry:
      # 프론트 요청 제한(15초) 안에 끝나도록 재시도하지 않는다(기본 10회).
      max-attempts: 1

  cloud:
    openfeign:
      client:
        config:
          default:
            # match·user 호출이 느리면 빨리 실패하고 Fallback으로 넘어간다.
            connect-timeout: 2000
            read-timeout: 3000

# LLM 호출 타임아웃. 넘으면 초안은 503, 검색·추천은 Fallback으로 응답한다.
ai:
  llm:
    connect-timeout: 3s
    read-timeout: 8s

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
