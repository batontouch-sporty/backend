name: sporty-infra

# infra EC2 전용. 앱은 K8s에서 돌고, 여기서는 DB·Redis·Kafka·RabbitMQ·모니터링만 띄운다.
# 서비스 정의는 루트 docker-compose.yml을 extends로 재사용하고, 다른 점만 적는다.
# 실행: 저장소 루트에서 docker compose --env-file .env -f deploy/infra/compose.yml up -d --wait
# extends는 루트 파일 전체를 해석하므로 infra에서 안 쓰는 JWT_SECRET_KEY도 .env에 값이 있어야 한다.
#
# 포트는 K8s 워커가 접근할 것만 INFRA_PRIVATE_IP(사설 IP)에 연다.
# 보안 그룹에서 3306·6379·9092·5672·9090은 VPC 내부(워커)만, 3001은 시연용으로 팀 IP만 허용한다.

x-root: &root
  file: ../../docker-compose.yml

services:
  mariadb:
    extends: {<<: *root, service: mariadb}
    # 루트는 127.0.0.1에만 연다. 워커 Pod가 붙도록 사설 IP로 바꾼다.
    ports: !override
      - "${INFRA_PRIVATE_IP:?INFRA_PRIVATE_IP가 필요하다}:3306:3306"

  redis:
    extends: {<<: *root, service: redis}
    ports: !override
      - "${INFRA_PRIVATE_IP:?}:6379:6379"

  kafka:
    extends: {<<: *root, service: kafka}
    environment:
      # 루트는 EXTERNAL을 localhost로 광고한다. 워커 Pod가 받은 주소로 다시 붙을 수 있게 사설 IP로 광고한다.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${INFRA_PRIVATE_IP:?}:9092
    ports: !override
      - "${INFRA_PRIVATE_IP:?}:9092:9092"

  kafka-exporter:
    extends: {<<: *root, service: kafka-exporter}

  # Spring Cloud Bus. 계정은 루트와 같은 .env 키를 쓴다. 사설망에 열리므로 값이 없으면 멈추고, guest가 아닌 값을 넣는다.
  rabbitmq:
    extends: {<<: *root, service: rabbitmq}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER가 필요하다}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD가 필요하다}
    # 관리 화면 15672는 서버 안에서만 연다. SSH 터널로 본다.
    ports: !override
      - "${INFRA_PRIVATE_IP:?}:5672:5672"
      - "127.0.0.1:15672:15672"

  prometheus:
    extends: {<<: *root, service: prometheus}
    # Gateway(K8s)의 /prometheus 조회가 이 포트로 온다.
    ports: !override
      - "${INFRA_PRIVATE_IP:?}:9090:9090"
    volumes:
      # 같은 경로에 마운트해 루트의 monitoring/prometheus.yml을 대신한다. alert-rules.yml은 루트 것을 그대로 쓴다.
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # K8s 앱 수집 대상. targets/k8s-targets.json은 서버에서 example을 복사해 채운다(Git 제외).
      - ./targets:/etc/prometheus/targets:ro

  alertmanager:
    extends: {<<: *root, service: alertmanager}
    # Prometheus만 내부 네트워크로 붙는다. 호스트에 열지 않는다.
    ports: !reset []

  grafana:
    extends: {<<: *root, service: grafana}
    # 시연용으로 모든 인터페이스에 연다. 보안 그룹에서 팀 IP만 허용한다.
    ports: !override
      - "${GRAFANA_HOST_PORT:-3001}:3000"

volumes:
  alertmanager-data:
  mariadb-data:
