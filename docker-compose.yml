name: sporty

# 접속 주소·추적 설정은 config-repo의 <서비스명>-dev.yml에 있다. 여기에는 프로필·Config 주소·시간대·비밀값만 둔다.
x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: dev
  TZ: Asia/Seoul
  JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"
  CONFIG_SERVER_URL: http://config-service:8888
  # Spring Cloud Bus 계정. config-service와 서비스 6개가 같은 값을 쓴다.
  RABBITMQ_USER: &rabbitmq-user ${RABBITMQ_USER:?RABBITMQ_USER가 필요하다. .env.example을 본다}
  RABBITMQ_PASSWORD: &rabbitmq-password ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD가 필요하다. .env.example을 본다}

x-app: &app
  environment: *app-env
  depends_on:
    config-service:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  discovery-service:
    <<: *app
    build: {context: ., dockerfile: discovery-service/Dockerfile}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  config-service:
    <<: *app
    build: {context: ., dockerfile: config-service/Dockerfile}
    environment:
      <<: *app-env
      # GitHub 연결이 끊겨도 config 때문에 전체 기동이 막히지 않게 health에서 저장소 검사를 뺀다.
      SPRING_CLOUD_CONFIG_SERVER_HEALTH_ENABLED: "false"
      # config-service 자신의 설정은 Config 저장소에서 받지 않으므로 Eureka·RabbitMQ 주소를 직접 넣는다.
      EUREKA_URL: http://discovery-service:8761/eureka
      RABBITMQ_HOST: rabbitmq
    # IDE로 띄운 서비스(local 프로필)가 설정을 받을 수 있게 호스트에 연다.
    ports:
      - "127.0.0.1:${CONFIG_HOST_PORT:-8888}:8888"
    depends_on:
      discovery-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway-service:
    <<: *app
    build: {context: ., dockerfile: gateway-service/Dockerfile}
    environment:
      <<: *app-env
      JWT_SECRET_KEY: &jwt ${JWT_SECRET_KEY:?JWT_SECRET_KEY가 필요하다. .env.example을 본다}
      # 값이 없으면 넘기지 않아 서비스 기본값을 쓴다. 비워서 넘기면 기본값이 무시된다.
      CORS_ALLOWED_ORIGIN:
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8000}:8000"

  user-service:
    <<: *app
    build: {context: ., dockerfile: user-service/Dockerfile}
    environment:
      <<: *app-env
      USER_APP_PASSWORD: ${USER_APP_PASSWORD:?}
      JWT_SECRET_KEY: *jwt
      # 개발·시연용 관리자 초기 계정. 비어 있으면 만들지 않고 정상 기동한다.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-}

  match-service:
    <<: *app
    build: {context: ., dockerfile: match-service/Dockerfile}
    environment:
      <<: *app-env
      MATCH_APP_PASSWORD: ${MATCH_APP_PASSWORD:?}

  facility-service:
    <<: *app
    build: {context: ., dockerfile: facility-service/Dockerfile}
    environment:
      <<: *app-env
      FACILITY_APP_PASSWORD: ${FACILITY_APP_PASSWORD:?}
      # 비어 있어도 기동한다. 비면 서울시 시설 동기화만 건너뛴다.
      PUBLIC_DATA_API_KEY: ${PUBLIC_DATA_API_KEY:-}

  ai-service:
    <<: *app
    build: {context: ., dockerfile: ai-service/Dockerfile}
    environment:
      <<: *app-env
      # 비어 있어도 기동한다. 키가 없으면 AI 호출만 실패하고 초안은 503, 검색·추천은 Fallback으로 응답한다.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}

  notification-service:
    <<: *app
    build: {context: ., dockerfile: notification-service/Dockerfile}
    environment:
      <<: *app-env
      NOTIFICATION_APP_PASSWORD: ${NOTIFICATION_APP_PASSWORD:?}

  mariadb:
    image: mariadb:11.4
    environment:
      TZ: Asia/Seoul
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?}
      USER_APP_PASSWORD: ${USER_APP_PASSWORD:?}
      MATCH_APP_PASSWORD: ${MATCH_APP_PASSWORD:?}
      FACILITY_APP_PASSWORD: ${FACILITY_APP_PASSWORD:?}
      NOTIFICATION_APP_PASSWORD: ${NOTIFICATION_APP_PASSWORD:?}
    ports:
      - "127.0.0.1:${MARIADB_HOST_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/init/init.sql:ro
      - ./docker/mariadb/schema.sql:/init/schema.sql:ro
      - ./docker/mariadb/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Spring Cloud Bus 전달용. 관리 화면은 http://localhost:15672 (계정은 .env의 RABBITMQ_USER·RABBITMQ_PASSWORD).
  rabbitmq:
    image: rabbitmq:3.13.7-management
    environment:
      RABBITMQ_DEFAULT_USER: *rabbitmq-user
      RABBITMQ_DEFAULT_PASS: *rabbitmq-password
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    command:
      - --kafka.server=kafka:29092
      - --kafka.version=3.9.1
    expose:
      - "9308"
    depends_on:
      kafka:
        condition: service_healthy

  zipkin:
    image: openzipkin/zipkin:3.6.1
    environment:
      STORAGE_TYPE: mem
    ports:
      - "127.0.0.1:${ZIPKIN_HOST_PORT:-9411}:9411"

  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro

  alertmanager:
    image: prom/alertmanager:v0.34.2
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    command:
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    environment:
      # 비어 있으면 Discord 전송만 비활성화하고 Alertmanager는 정상 기동한다.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/alertmanager.disabled.yml:/etc/alertmanager/alertmanager.disabled.yml:ro
      - ./monitoring/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - ./monitoring/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager-data:/alertmanager

  grafana:
    image: grafana/grafana:13.3.0
    # Compose는 파일 전체를 먼저 해석한다. :?로 막으면 Grafana를 안 쓰는 명령까지 실패하므로 기동할 때 검사한다.
    entrypoint: ["sh", "-c", ': "$${GF_SECURITY_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD가 필요하다}"; exec /run.sh']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro

volumes:
  alertmanager-data:
  mariadb-data:
