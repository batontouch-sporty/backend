server:
  port: 8000

spring:
  application:
    name: gateway-service
  config:
    # 로컬 실행 때는 저장소 루트의 .env(docker compose와 같은 파일)에서 JWT 비밀값을 읽는다.
    import:
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  cloud:
    gateway:
      server:
        webflux:
          # 프론트는 쿠키 없이 Authorization 헤더로만 인증하므로 allow-credentials는 켜지 않는다.
          globalcors:
            # Method 조건이 있는 라우트는 OPTIONS가 걸리지 않아 사전 요청이 403이 되므로 라우트 밖에서도 CORS를 처리한다.
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: [Authorization, Content-Type]
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/user-service/**
              filters:
                - RewritePath=/user-service/(?<segment>.*), /$\{segment}
            - id: match-service
              uri: lb://MATCH-SERVICE
              predicates:
                - Path=/match-service/**
              filters:
                - RewritePath=/match-service/(?<segment>.*), /$\{segment}
            - id: facility-service
              uri: lb://FACILITY-SERVICE
              predicates:
                - Path=/facility-service/**
              filters:
                - RewritePath=/facility-service/(?<segment>.*), /$\{segment}
            - id: ai-service
              uri: lb://AI-SERVICE
              predicates:
                - Path=/ai-service/**
              filters:
                - RewritePath=/ai-service/(?<segment>.*), /$\{segment}
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/notification-service/**
              filters:
                - RewritePath=/notification-service/(?<segment>.*), /$\{segment}
            # 조회 두 경로만 연다. 나머지 Prometheus API는 라우트가 없어 Gateway에서 404로 끝난다.
            - id: prometheus
              uri: ${PROMETHEUS_URL:http://localhost:9090}
              predicates:
                - Path=/prometheus/api/v1/query,/prometheus/api/v1/query_range,false
                - Method=GET
              filters:
                - RewritePath=/prometheus/(?<segment>.*), /$\{segment}
                # Prometheus는 토큰과 회원 정보를 쓰지 않으므로 넘기지 않는다.
                - RemoveRequestHeader=Authorization
                - RemoveRequestHeader=X-User-Id
                - RemoveRequestHeader=X-User-Role
                # Origin을 넘기면 Prometheus도 CORS 헤더를 붙여 응답에 값이 2개가 되고 브라우저가 거부한다.
                - RemoveRequestHeader=Origin

jwt:
  secret: ${JWT_SECRET_KEY}

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  # 8000은 외부에 게시되므로 Gateway 자신의 Actuator는 내부 수집용 포트로 분리한다.
  server:
    port: 8001
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
