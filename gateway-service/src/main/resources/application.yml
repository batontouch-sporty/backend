server:
  port: 8000

spring:
  application:
    name: gateway-service
  config:
    # 로컬 실행 때는 저장소 루트의 .env(docker compose와 같은 파일)에서 JWT 비밀값을 읽는다.
    import:
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - optional:file:../.env[.properties]
  cloud:
    gateway:
      server:
        webflux:
          # 프론트는 쿠키 없이 Authorization 헤더로만 인증하므로 allow-credentials는 켜지 않는다.
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: [Authorization, Content-Type]
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/user-service/**
              filters:
                - RewritePath=/user-service/(?<segment>.*), /$\{segment}
            - id: match-service
              uri: lb://MATCH-SERVICE
              predicates:
                - Path=/match-service/**
              filters:
                - RewritePath=/match-service/(?<segment>.*), /$\{segment}
            - id: facility-service
              uri: lb://FACILITY-SERVICE
              predicates:
                - Path=/facility-service/**
              filters:
                - RewritePath=/facility-service/(?<segment>.*), /$\{segment}
            - id: ai-service
              uri: lb://AI-SERVICE
              predicates:
                - Path=/ai-service/**
              filters:
                - RewritePath=/ai-service/(?<segment>.*), /$\{segment}
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/notification-service/**
              filters:
                - RewritePath=/notification-service/(?<segment>.*), /$\{segment}

jwt:
  secret: ${JWT_SECRET_KEY}

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
