server:
  port: 8000

spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/user-service/**
              filters:
                - RewritePath=/user-service/(?<segment>.*), /$\{segment}
            - id: match-service
              uri: lb://MATCH-SERVICE
              predicates:
                - Path=/match-service/**
              filters:
                - RewritePath=/match-service/(?<segment>.*), /$\{segment}
            - id: facility-service
              uri: lb://FACILITY-SERVICE
              predicates:
                - Path=/facility-service/**
              filters:
                - RewritePath=/facility-service/(?<segment>.*), /$\{segment}
            - id: ai-service
              uri: lb://AI-SERVICE
              predicates:
                - Path=/ai-service/**
              filters:
                - RewritePath=/ai-service/(?<segment>.*), /$\{segment}
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/notification-service/**
              filters:
                - RewritePath=/notification-service/(?<segment>.*), /$\{segment}

eureka:
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
