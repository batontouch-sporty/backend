apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: sporty
  labels:
    app.kubernetes.io/name: discovery-service
    app.kubernetes.io/component: discovery
    app.kubernetes.io/part-of: sporty
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: discovery-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discovery-service
        app.kubernetes.io/component: discovery
        app.kubernetes.io/part-of: sporty
    spec:
      containers:
        - name: discovery-service
          image: sporty-discovery-service:k8s-draft
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8761
              protocol: TCP
          envFrom:
            - configMapRef:
                name: discovery-service-config
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      terminationGracePeriodSeconds: 30
