apiVersion: apps/v1
kind: Deployment
metadata:
  name: facility-service
  namespace: sporty
  labels:
    app.kubernetes.io/name: facility-service
    app.kubernetes.io/component: facility
    app.kubernetes.io/part-of: sporty
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: facility-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: facility-service
        app.kubernetes.io/component: facility
        app.kubernetes.io/part-of: sporty
    spec:
      containers:
        - name: facility-service
          image: sporty-facility-service:k8s-draft
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          envFrom:
            - configMapRef:
                name: app-common-config
            - configMapRef:
                name: app-client-config
            - configMapRef:
                name: tracing-config
          env:
            - name: MARIADB_HOST
              valueFrom:
                configMapKeyRef:
                  name: sporty-infra-endpoints
                  key: MARIADB_HOST
            - name: MARIADB_HOST_PORT
              valueFrom:
                configMapKeyRef:
                  name: sporty-infra-endpoints
                  key: MARIADB_HOST_PORT
                  optional: true
            - name: FACILITY_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: facility-service-secret
                  key: FACILITY_APP_PASSWORD
            - name: PUBLIC_DATA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: facility-service-secret
                  key: PUBLIC_DATA_API_KEY
                  optional: true
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      terminationGracePeriodSeconds: 30
