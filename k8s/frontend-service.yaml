# 브라우저 접속 진입점. 보안 그룹에서 30000을 연다.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sporty
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: sporty
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30000
      protocol: TCP
