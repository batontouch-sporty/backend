apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: sporty
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: sporty
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-service
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: sporty
    spec:
      # 노드 1대 장애에도 응답하도록 worker마다 1개씩 둔다(taint가 있는 master는 계산에서 뺀다).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gateway-service
      containers:
        - name: gateway-service
          image: sporty-gateway-service:k8s-draft
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: management
              containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: app-common-config
            - configMapRef:
                name: app-client-config
            - configMapRef:
                name: tracing-config
          env:
            # Spring Cloud Bus(RabbitMQ). infra EC2 주소는 ConfigMap, 계정은 Secret에서 받는다.
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: sporty-infra-endpoints
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: sporty-infra-endpoints
                  key: RABBITMQ_PORT
                  optional: true
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: sporty-rabbitmq
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sporty-rabbitmq
                  key: RABBITMQ_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sporty-jwt
                  key: JWT_SECRET_KEY
            - name: PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: sporty-infra-endpoints
                  key: PROMETHEUS_URL
            - name: CORS_ALLOWED_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: sporty-infra-endpoints
                  key: CORS_ALLOWED_ORIGIN
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 48
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      terminationGracePeriodSeconds: 30
