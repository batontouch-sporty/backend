# 외부 API 진입점. 보안 그룹에서 30080을 연다.
# 클러스터 안 프록시(프론트 nginx)는 ClusterIP gateway-service:8000을 그대로 쓴다.
apiVersion: v1
kind: Service
metadata:
  name: gateway-nodeport
  namespace: sporty
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: sporty
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway-service
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
      protocol: TCP
