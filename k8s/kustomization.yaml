apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sporty

resources:
  - namespace.yaml
  - app-common-configmap.yaml
  - discovery-configmap.yaml
  - discovery-deployment.yaml
  - discovery-service.yaml
  - config-configmap.yaml
  - config-deployment.yaml
  - config-service.yaml
  - app-client-configmap.yaml
  - match-deployment.yaml
  - match-service.yaml
  - gateway-deployment.yaml
  - gateway-service.yaml
  - gateway-nodeport.yaml
  - user-deployment.yaml
  - user-service.yaml
  - facility-deployment.yaml
  - facility-service.yaml
  - ai-deployment.yaml
  - ai-service.yaml
  - notification-deployment.yaml
  - notification-service.yaml
  - tracing-configmap.yaml
  - zipkin-deployment.yaml
  - zipkin-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - monitoring-nodeport.yaml

images:
  - name: sporty-discovery-service
    newName: sporty-discovery-service
    newTag: k8s-draft
  - name: sporty-config-service
    newName: sporty-config-service
    newTag: k8s-draft
  - name: sporty-match-service
    newName: sporty-match-service
    newTag: k8s-draft
  - name: sporty-gateway-service
    newName: sporty-gateway-service
    newTag: k8s-draft
  - name: sporty-user-service
    newName: sporty-user-service
    newTag: k8s-draft
  - name: sporty-facility-service
    newName: sporty-facility-service
    newTag: k8s-draft
  - name: sporty-ai-service
    newName: sporty-ai-service
    newTag: k8s-draft
  - name: sporty-notification-service
    newName: sporty-notification-service
    newTag: k8s-draft
  - name: sporty-frontend
    newName: sporty-frontend
    newTag: k8s-draft
