apiVersion: apps/v1
kind: Deployment
metadata:
  name: match-service
  namespace: sporty
  labels:
    app.kubernetes.io/name: match-service
    app.kubernetes.io/component: match
    app.kubernetes.io/part-of: sporty
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: match-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: match-service
        app.kubernetes.io/component: match
        app.kubernetes.io/part-of: sporty
    spec:
      containers:
        - name: match-service
          image: sporty-match-service:k8s-draft
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          envFrom:
            - configMapRef:
                name: app-common-config
            - configMapRef:
                name: app-client-config
            - configMapRef:
                name: tracing-config
          env:
            # Spring Cloud Bus(RabbitMQ). infra EC2 주소는 ConfigMap, 계정은 Secret에서 받는다.
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: sporty-infra-endpoints
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: sporty-infra-endpoints
                  key: RABBITMQ_PORT
                  optional: true
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: sporty-rabbitmq
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sporty-rabbitmq
                  key: RABBITMQ_PASSWORD
            # Enables the Kafka listener that handles user withdrawal requests.
            - name: MATCH_WITHDRAWAL_ENABLED
              value: "true"
            - name: MARIADB_HOST
              valueFrom:
                configMapKeyRef:
                  name: sporty-infra-endpoints
                  key: MARIADB_HOST
            - name: MARIADB_HOST_PORT
              valueFrom:
                configMapKeyRef:
                  name: sporty-infra-endpoints
                  key: MARIADB_HOST_PORT
                  optional: true
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: sporty-infra-endpoints
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: MATCH_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: match-service-secret
                  key: MATCH_APP_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 48
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      terminationGracePeriodSeconds: 30
