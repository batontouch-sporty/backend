# infra EC2의 Prometheus가 /actuator/prometheus를 긁을 관리 포트 NodePort.
# 보안 그룹에서 30100~30199는 infra EC2 사설 IP만 허용한다. 외부에 열지 않는다.
# Gateway는 관리 포트 8001이 따로 있고, 업무 서비스는 관리 포트가 서비스 포트와 같다.
apiVersion: v1
kind: Service
metadata:
  name: gateway-metrics
  namespace: sporty
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: sporty
spec:
  type: NodePort
  # Pod가 2개라 노드마다 자기 노드의 Pod만 응답하게 한다. Prometheus는 worker별 주소로 Pod를 하나씩 따로 긁는다.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: gateway-service
  ports:
    - name: management
      port: 8001
      targetPort: management
      nodePort: 30101
      protocol: TCP
---
