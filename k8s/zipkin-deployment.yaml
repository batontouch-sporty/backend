apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: sporty
  labels:
    app.kubernetes.io/name: zipkin
    app.kubernetes.io/component: tracing
    app.kubernetes.io/part-of: sporty
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zipkin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zipkin
        app.kubernetes.io/component: tracing
        app.kubernetes.io/part-of: sporty
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3.6.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9411
              protocol: TCP
          env:
            - name: STORAGE_TYPE
              value: "mem"
          readinessProbe:
            httpGet:
              path: /health
              port: 9411
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 9411
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
