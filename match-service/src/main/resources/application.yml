server:
  port: 8082

spring:
  application:
    name: match-service
  datasource:
    url: jdbc:mariadb://${MATCH_DB_HOST:localhost}:${MARIADB_HOST_PORT:3306}/match_db
    username: ${MATCH_DB_USERNAME:match_app}
    password: ${MATCH_APP_PASSWORD}
  config:
    import:
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  health:
    db:
      enabled: ${MATCH_DB_HEALTH_ENABLED:true}
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

# Enable only after official R7 schema initialization. No CREATE/ALTER by the app.
match:
  withdrawal:
    enabled: ${MATCH_WITHDRAWAL_ENABLED:false}
