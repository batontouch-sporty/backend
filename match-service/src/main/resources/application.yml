server:
  port: 8082

spring:
  application:
    name: match-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          matchMemberClient:
            connectTimeout: ${MATCH_USER_CONNECT_TIMEOUT_MS:1000}
            readTimeout: ${MATCH_USER_READ_TIMEOUT_MS:2000}
          matchFacilityClient:
            connectTimeout: ${MATCH_FACILITY_CONNECT_TIMEOUT_MS:1000}
            readTimeout: ${MATCH_FACILITY_READ_TIMEOUT_MS:2000}
  datasource:
    url: jdbc:mariadb://${MATCH_DB_HOST:localhost}:${MARIADB_HOST_PORT:3306}/match_db
    username: ${MATCH_DB_USERNAME:match_app}
    password: ${MATCH_APP_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${MATCH_DB_DDL_AUTO:validate}
  config:
    import:
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  health:
    db:
      enabled: ${MATCH_DB_HEALTH_ENABLED:true}
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

match:
  withdrawal:
    enabled: ${MATCH_WITHDRAWAL_ENABLED:false}
  clients:
    user:
      url: ${MATCH_USER_SERVICE_URL:}
    facility:
      url: ${MATCH_FACILITY_SERVICE_URL:}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        ignoreExceptions:
          - feign.FeignException$NotFound
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
