global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by: [alertname, application, instance, consumergroup, topic]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /run/secrets/discord_webhook_url
        send_resolved: true
        title: '{{ template "sporty.discord.title" . }}'
        message: '{{ template "sporty.discord.message" . }}'

templates:
  - /etc/alertmanager/templates/*.tmpl
