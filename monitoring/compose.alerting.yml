# 저장소 루트의 Compose를 먼저 지정해야 상대 경로가 저장소 루트 기준이 됩니다.
# 루트 Prometheus와 같은 네트워크에 Alertmanager를 추가합니다.
# docker compose --env-file .env -f docker-compose.yml -f monitoring/compose.alerting.yml up -d prometheus alertmanager
services:
  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager-data:/alertmanager
    secrets:
      - discord_webhook_url

secrets:
  discord_webhook_url:
    environment: DISCORD_WEBHOOK_URL

volumes:
  alertmanager-data:
