# 테스트 전용. main의 application.yml 대신 이 파일을 읽는다.
# DB는 H2 메모리(MariaDB 모드)라 외부 컨테이너 없이 돈다.
spring:
  application:
    name: notification-service
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:notification_db;MODE=MariaDB;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  # Kafka 구독은 브로커를 띄우는 테스트(MatchEventConsumerTest)에서만 켠다.
  kafka:
    listener:
      auto-startup: false

eureka:
  client:
    enabled: false
