server:
  port: 8081

spring:
  application:
    name: user-service
  # match 결과 조회 타임아웃 기본값. match는 회원 잠금을 최대 3초 기다리므로 읽기는 그보다 길게 둔다.
  # config-repo에 같은 키가 있으면 그 값이 우선한다.
  cloud:
    openfeign:
      client:
        config:
          userMatchWithdrawalClient:
            connectTimeout: ${USER_MATCH_CONNECT_TIMEOUT_MS:1000}
            readTimeout: ${USER_MATCH_READ_TIMEOUT_MS:5000}
  profiles:
    # IDE 실행은 local. Compose는 dev, K8s는 prod를 SPRING_PROFILES_ACTIVE로 준다.
    default: local
  config:
    # 설정은 config-repo의 user-service.yml·user-service-<프로필>.yml에 있다. Config Server에 못 붙으면 기동하지 않는다.
    # IDE 실행 전에 Compose로 config-service를 먼저 띄운다(docker compose up -d --wait config-service).
    # 로컬 실행 때는 저장소 루트의 .env(docker compose와 같은 파일)에서 비밀값·포트를 읽는다.
    import:
      - configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

