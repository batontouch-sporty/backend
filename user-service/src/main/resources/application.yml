server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    # 로컬 실행 때는 저장소 루트의 .env(docker compose와 같은 파일)에서 DB 비밀번호·포트를 읽는다.
    import:
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${USER_DB_HOST:localhost}:${MARIADB_HOST_PORT:3306}/user_db
    username: ${USER_DB_USERNAME:user_app}
    password: ${USER_APP_PASSWORD}
  jpa:
    # 테이블 명세(R4) 적용 방식이 정해지면 validate로 바꾼다.
    hibernate:
      ddl-auto: ${USER_DB_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_HOST_PORT:6379}
      timeout: 6000ms
  kafka:
    # Compose에서는 공통 환경변수 SPRING_KAFKA_BOOTSTRAP_SERVERS(kafka:29092)가 이 값을 덮어쓴다.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_HOST_PORT:9092}}
    producer:
      # 브로커가 없을 때 Outbox 발행이 DB 잠금을 오래 잡지 않게 대기 시간을 줄인다.
      properties:
        max.block.ms: 3000
    consumer:
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET_KEY}

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus

# 탈퇴 Saga. 시연에서 시간 초과를 빨리 보여 줄 때는 WITHDRAWAL_SAGA_TIMEOUT(예: 30s)·WITHDRAWAL_SAGA_GRACE를 줄인다.
# timeout은 match-service 규칙대로 0초 초과 5분 이하만 된다.
withdrawal:
  saga:
    timeout: ${WITHDRAWAL_SAGA_TIMEOUT:5m}
    grace: ${WITHDRAWAL_SAGA_GRACE:30s}

# 개발·시연용 관리자 초기 계정. ADMIN_EMAIL·ADMIN_PASSWORD가 둘 다 있으면 기동할 때 없을 때만 만든다.
admin:
  account:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    nickname: ${ADMIN_NICKNAME:}
