server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    # 로컬 실행 때는 저장소 루트의 .env(docker compose와 같은 파일)에서 DB 비밀번호·포트를 읽는다.
    import:
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${USER_DB_HOST:localhost}:${MARIADB_HOST_PORT:3306}/user_db
    username: ${USER_DB_USERNAME:user_app}
    password: ${USER_APP_PASSWORD}
  jpa:
    # 테이블 명세(R4) 적용 방식이 정해지면 validate로 바꾼다.
    hibernate:
      ddl-auto: ${USER_DB_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_HOST_PORT:6379}
      timeout: 6000ms

jwt:
  secret: ${JWT_SECRET_KEY}

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
